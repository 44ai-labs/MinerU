apiVersion: apps/v1
kind: Deployment
metadata:
  name: mineru-44ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mineru-44ai
  template:
    metadata:
      labels:
        app: mineru-44ai
    spec:
      containers:
        - name: mineru-44ai
          image: 44ai/44ai-mineru:main
          resources:
            requests:
              cpu: 1
              memory: 10Gi
          ports:
            - containerPort: 8000
          command: ["/bin/bash", "-c"]
          args: ["make start"]
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mineru-44ai-service
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30001
  selector:
    app: mineru-44ai
  type: NodePort
